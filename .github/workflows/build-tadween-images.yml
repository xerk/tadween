---
# Tadween images for the production server (ARM): the app (backend, frontend
# and orchestrator, Dockerfile.dev) and the landing site (apps/landing).
# Run it from the Actions tab. The upstream "Build Containers" workflow pushes
# to Postiz's own registry and is left as it is for upstream syncs.
name: "Build Tadween images"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, e.g. 2026-10-12"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  app:
    runs-on: ubuntu-24.04-arm
    steps:
      # Full history and tags, to find the Postiz release this build is on
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The app shows the Postiz release it is based on (the newest upstream
      # v* tag merged into this commit, e.g. v2.25.1), not the image tag.
      # Push upstream's release tags to this repo when syncing.
      - name: Build and push the app
        run: |
          VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
          echo "Postiz version: $VERSION"
          docker buildx build --platform linux/arm64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=$VERSION \
            --provenance=false --sbom=false \
            -t ghcr.io/${{ github.repository_owner }}/tadween-app:${{ inputs.tag }} \
            -t ghcr.io/${{ github.repository_owner }}/tadween-app:latest \
            --push .

  landing:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Public values only (docs/tadween/legal.md); the landing inlines them at build time.
      - name: Build and push the landing site
        run: |
          docker buildx build --platform linux/arm64 \
            -f apps/landing/Dockerfile \
            --build-arg NEXT_PUBLIC_SITE_URL=https://tadween.app \
            --build-arg NEXT_PUBLIC_APP_URL=https://studio.tadween.app \
            --build-arg NEXT_PUBLIC_API_URL=https://studio.tadween.app/api \
            --build-arg NEXT_PUBLIC_LEGAL_COMPANY="Xerk LLC" \
            --build-arg NEXT_PUBLIC_LEGAL_STATE="Wyoming" \
            --build-arg NEXT_PUBLIC_LEGAL_ADDRESS="30 N Gould St Ste R, Sheridan, WY 82801, United States" \
            --build-arg NEXT_PUBLIC_SUPPORT_EMAIL="support@xerk.io" \
            --build-arg NEXT_PUBLIC_LEGAL_GOVERNING_LAW="Wyoming" \
            --build-arg NEXT_PUBLIC_LEGAL_VENUE="Sheridan County, Wyoming" \
            --build-arg NEXT_PUBLIC_REFUND_DAYS="14" \
            --build-arg NEXT_PUBLIC_LEGAL_AI_PROVIDERS="OpenAI" \
            --build-arg NEXT_PUBLIC_LEGAL_EMAIL_PROVIDER="none configured at this time" \
            --build-arg NEXT_PUBLIC_LEGAL_HOSTING_PROVIDER="Oracle Cloud Infrastructure (servers and file storage)" \
            --build-arg NEXT_PUBLIC_LEGAL_ANALYTICS="none" \
            --provenance=false --sbom=false \
            -t ghcr.io/${{ github.repository_owner }}/tadween-landing:${{ inputs.tag }} \
            -t ghcr.io/${{ github.repository_owner }}/tadween-landing:latest \
            --push .
